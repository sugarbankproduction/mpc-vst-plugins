<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moo Won</title>
<meta name="description" content="Moo Won, a three-synth instrument with its full panel, playing in your browser.">
<link rel="stylesheet" href="full.css">
</head>
<body>
<div id="start-box" class="start">
  <h1>MOO WON</h1>
  <button id="start" class="big red" disabled>Turn on sound</button>
  <p id="status" class="hint">Loading the synth…</p>
</div>
<div id="stage" hidden>
  <canvas id="panel" tabindex="0" aria-label="Moo Won panel"></canvas>
</div>
<div id="bar" hidden>
  <span id="midi-status"></span>
  <span id="cpu"></span>
</div>
<div id="ui-layer"></div>
<script src="moowon_full.js"></script>
<script type="module" src="full.js"></script>
</body>
</html>
